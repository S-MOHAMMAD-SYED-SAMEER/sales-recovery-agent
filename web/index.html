<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sales-Recovery Agent — Demo</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 16px;
      color: #1a1a1a;
    }
    h1 { font-size: 1.25rem; }
    #log {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 12px;
      min-height: 300px;
      max-height: 500px;
      overflow-y: auto;
      margin-bottom: 12px;
    }
    .msg { margin-bottom: 10px; line-height: 1.4; }
    .msg .role { font-weight: 600; margin-right: 6px; }
    .msg.user .role { color: #2563eb; }
    .msg.assistant .role { color: #15803d; }
    .msg.error .role { color: #b91c1c; }
    form { display: flex; gap: 8px; }
    input[type="text"] { flex: 1; padding: 8px; font-size: 1rem; }
    button { padding: 8px 16px; font-size: 1rem; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Sales-Recovery Agent — M1 skeleton demo</h1>
  <p>No RAG, tools, or memory yet — this only proves the client &rarr; server &rarr; Claude &rarr; client wiring works.</p>
  <div id="log"></div>
  <form id="chat-form">
    <input id="message" type="text" placeholder="Ask something..." autocomplete="off" required />
    <button type="submit">Send</button>
  </form>

  <script>
    const SESSION_KEY = 'sra_session_id';
    let sessionId = localStorage.getItem(SESSION_KEY);
    if (!sessionId) {
      sessionId = crypto.randomUUID();
      localStorage.setItem(SESSION_KEY, sessionId);
    }

    const log = document.getElementById('log');
    const form = document.getElementById('chat-form');
    const input = document.getElementById('message');

    function appendMessage(role, text) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.innerHTML = `<span class="role">${role}:</span><span></span>`;
      div.querySelector('span:last-child').textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;

      appendMessage('user', message);
      input.value = '';
      input.disabled = true;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, message }),
        });
        const data = await res.json();
        if (!res.ok) {
          appendMessage('error', data.error || `Request failed (${res.status})`);
        } else {
          appendMessage('assistant', data.reply);
        }
      } catch (err) {
        appendMessage('error', 'Network error — is the server running?');
      } finally {
        input.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
